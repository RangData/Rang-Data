        const exchangeRates = {
            PKR: { rate: 1, symbol: "Rs.", code: "PKR" },
            USD: { rate: 0.0036, symbol: "$", code: "USD" },
            GBP: { rate: 0.0028, symbol: "£", code: "GBP" },
            AED: { rate: 0.0132, symbol: "AED ", code: "AED" },

        const savedCurrency = localStorage.getItem('selected_currency') || 'PKR';
        document.getElementById('currency-selector').value = savedCurrency;

        function changeCurrency(currency) {
            localStorage.setItem('selected_currency', currency);
            loadProductDetails();
            loadRelatedProducts();
            updateCartUI();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id') || "1";
        let currentProduct = productsData[productId] || productsData["1"];

        function loadProductDetails() {
            const container = document.getElementById('product-details-container');
            const currentCurr = localStorage.getItem('selected_currency') || 'PKR';
            const currObj = exchangeRates[currentCurr];
            let convertedPrice = Math.round(currentProduct.priceVal * currObj.rate);

            let thumbsHTML = '';
            currentProduct.imgs.forEach((img, idx) => {
                thumbsHTML += `<img src="${img}" class="${idx === 0 ? 'active-thumb' : ''}" onclick="changeMainImage('${img}', this)">`;
            });

            container.innerHTML = `
                <div class="product-gallery">
                    <div class="thumbnail-list">
                        ${thumbsHTML}
                    </div>
                    <div class="main-img-wrapper">
                        <img id="main-product-img" src="${currentProduct.imgs[0]}" alt="${currentProduct.title}">
                    </div>
                </div>
                <div class="product-details">
                    <h1>${currentProduct.title}</h1>
                    <div class="product-code-tag">Design Code: ${currentProduct.code}</div>
                    <div class="product-price" id="prod-price-display">${currObj.symbol}${convertedPrice.toLocaleString()}.00 ${currObj.code}</div>

                    <div class="quantity-selector">
                        <button type="button" onclick="decreaseQty()">-</button>
                        <input type="text" id="quantity-input" value="1" readonly>
                        <button type="button" onclick="increaseQty()">+</button>
                    </div>

                    <div class="btn-actions">
                        <button class="btn-add-cart" onclick="addToCart()">ADD TO CART</button>
                        <button class="btn-buy-now" onclick="buyNow()">BUY IT NOW</button>
                    </div>

                        <div class="fabric-section-title"><i class="fas fa-scroll"></i> DUPATTA FABRIC :</div>
                        <div class="fabric-section-desc">Fine Chiffon Dupatta - 2.5 Meters</div>

                        <div class="fabric-section-title"><i class="fas fa-layer-group"></i> TROUSER FABRIC :</div>
                        <div class="fabric-section-desc">Dyed Premium Cotton / Lawn - 2.5 Meters</div>
                    </div>
                </div>
            `;
        }

        function loadRelatedProducts() {
            const container = document.getElementById('related-grid-container');
            const currentCurr = localStorage.getItem('selected_currency') || 'PKR';
            const currObj = exchangeRates[currentCurr];

            let productKeys = Object.keys(productsData).filter(id => id !== currentProduct.id);
            let shuffled = productKeys.sort(() => 0.5 - Math.random());
            let selectedKeys = shuffled.slice(0, 4);

            let html = '';
            selectedKeys.forEach(key => {
                let p = productsData[key];
                let pPrice = Math.round(p.priceVal * currObj.rate);
                html += `
                    <a href="product.html?id=${p.id}" class="product-card">
                        <img src="${p.imgs[0]}" alt="${p.title}">
                        <div class="product-card-info">
                            <div class="product-card-title">${p.title}</div>
                            <div class="product-card-price">${currObj.symbol}${pPrice.toLocaleString()} ${currObj.code}</div>

                    </a>
                `;
            });
            container.innerHTML = html;
        }

        function changeMainImage(imgSrc, thumbElement) {
            document.getElementById('main-product-img').src = imgSrc;
            document.querySelectorAll('.thumbnail-list img').forEach(el => el.classList.remove('active-thumb'));
            thumbElement.classList.add('active-thumb');
        }

        function increaseQty() {
            let input = document.getElementById('quantity-input');
            input.value = parseInt(input.value) + 1;
        }

        function decreaseQty() {
            let input = document.getElementById('quantity-input');
            if(parseInt(input.value) > 1) {
                input.value = parseInt(input.value) - 1;
            }
        }

        let cart = JSON.parse(localStorage.getItem('rd_cart')) || [];

        function addToCart() {
            let qtyInput = document.getElementById('quantity-input');
            let qty = qtyInput ? parseInt(qtyInput.value) : 1;
            let existingItem = cart.find(item => item.id === currentProduct.id);

            if(existingItem) {
                existingItem.qty += qty;
            } else {
                cart.push({
                    id: currentProduct.id,
                    code: currentProduct.code,
                    title: currentProduct.title,
                    priceVal: currentProduct.priceVal,
                    img: currentProduct.imgs[0],
                    qty: qty
                });
            }

            updateCartUI();
            openCartDrawer();
        }

        function buyNow() {
            let qtyInput = document.getElementById('quantity-input');
            let qty = qtyInput ? parseInt(qtyInput.value) : 1;
            let itemToBuy = {
                id: currentProduct.id,
                code: currentProduct.code,
                title: currentProduct.title,
                priceVal: currentProduct.priceVal,
                img: currentProduct.imgs[0],
                qty: qty
            };
            localStorage.setItem('rd_checkout_item', JSON.stringify(itemToBuy));
            window.location.href = "checkout.html";
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-count-badge');
            const totalElem = document.getElementById('cart-total-price');
            const currentCurr = localStorage.getItem('selected_currency') || 'PKR';
            const currObj = exchangeRates[currentCurr];
            
            let totalQty = 0;
            let totalPricePKR = 0;

            if(!container || !badge || !totalElem) return;

            if(cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #777; margin-top: 30px;">Your cart is currently empty.</p>`;
            } else {
                container.innerHTML = '';
                cart.forEach((item, idx) => {
                    totalQty += item.qty;
                    totalPricePKR += item.priceVal * item.qty;
                    let itemConvertedPrice = Math.round(item.priceVal * currObj.rate);

                    container.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.img}" alt="${item.title}">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${item.title} (${item.code})</div>
                                <div class="cart-item-price">${currObj.symbol}${itemConvertedPrice.toLocaleString()} ${currObj.code}</div>
                                <div class="cart-item-qty">Qty: ${item.qty}</div>
                                <span class="remove-item" onclick="removeFromCart(${idx})">Remove</span>
                            </div>
                        </div>
                    `;
                });
            }

            let finalConvertedTotal = Math.round(totalPricePKR * currObj.rate);
            badge.innerText = totalQty;
            totalElem.innerText = `${currObj.symbol}${finalConvertedTotal.toLocaleString()} ${currObj.code}`;
            localStorage.setItem('rd_cart', JSON.stringify(cart));
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function openCartDrawer() {
            const overlay = document.getElementById('cart-overlay');
            const drawer = document.getElementById('cart-drawer');
            if(overlay) overlay.style.display = 'block';
            if(drawer) drawer.classList.add('open');
        }

        function closeCartDrawer() {
            const overlay = document.getElementById('cart-overlay');
            const drawer = document.getElementById('cart-drawer');
            if(overlay) overlay.style.display = 'none';
            if(drawer) drawer.classList.remove('open');
        }

        function proceedToCheckoutFromCart() {
            if(cart.length === 0) {
                alert("Please add items to cart first!");
                return;
            }
            localStorage.setItem('rd_checkout_item', JSON.stringify(cart[0]));
            window.location.href = "checkout.html";
        }

        loadProductDetails();
        loadRelatedProducts();
        updateCartUI();

        // --- ENHANCED SEARCH FUNCTIONALITY ---
        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            if(!query) return;

            let matchedId = null;
            for(let id in productsData) {
                let prod = productsData[id];
                let titleLower = prod.title.toLowerCase();
                let codeLower = prod.code.toLowerCase();

                if(codeLower.includes(query) || titleLower.includes(query)) {
                    matchedId = id;
                    break;
                }
            }

            if(matchedId) {
                window.location.href = `product.html?id=${matchedId}`;
            } else {
                alert("Koi product is name, color ya code se match nahi hui!");
            }
        }
    </script>
</body>
</html>
