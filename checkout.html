<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - RANG DATA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff; color: #333333; line-height: 1.5; }

        .checkout-layout { display: flex; min-height: 100vh; flex-wrap: wrap; }
        
        /* Left Section (Form) */
        .main-section { flex: 1.2; padding: 40px 60px 40px 10%; border-right: 1px solid #e6e6e6; }
        .brand-header { font-family: 'Times New Roman', serif; font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #4A0424; text-decoration: none; display: inline-block; margin-bottom: 25px; }

        .section-title { font-size: 18px; font-weight: 600; color: #111; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .section-title a { font-size: 13px; color: #4A0424; text-decoration: underline; font-weight: normal; }

        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid #d9d9d9; border-radius: 5px; font-size: 14px; outline: none; transition: 0.2s; background: #fff; color: #333; }
        input:focus, select:focus, textarea:focus { border-color: #4A0424; box-shadow: 0 0 0 1px #4A0424; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; margin-top: 8px; margin-bottom: 20px; }
        .checkbox-group input { width: auto; cursor: pointer; }

        .shipping-box { background: #fafafa; border: 1px solid #e6e6e6; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; margin-top: 10px; margin-bottom: 25px; }

        .payment-box { border: 1px solid #d9d9d9; border-radius: 5px; overflow: hidden; margin-top: 10px; margin-bottom: 30px; }
        .payment-option { padding: 14px 16px; background: #fcfcfc; border-bottom: 1px solid #d9d9d9; }
        .payment-details { background: #fafafa; padding: 15px 20px; font-size: 13px; color: #555; }
        
        .btn-complete-order { width: 100%; background: #4A0424; color: #ffffff; padding: 18px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.3s; }
        .btn-complete-order:hover { background: #330218; }

        /* Right Section (Order Summary) */
        .sidebar-section { flex: 0.8; background: #fafafa; padding: 40px 10% 40px 40px; }
        .product-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .product-img-wrap { position: relative; width: 68px; height: 68px; border-radius: 8px; border: 1px solid #e1e1e1; background: #fff; }
        .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .product-qty-badge { position: absolute; top: -8px; right: -8px; background: rgba(114, 114, 114, 0.9); color: #fff; font-size: 12px; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .product-info { flex-grow: 1; }
        .product-info h4 { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 3px; }
        .product-info p { font-size: 12px; color: #777; }
        .product-price { font-size: 14px; font-weight: 600; color: #333; }

        .discount-row { display: flex; gap: 10px; margin: 20px 0; border-top: 1px solid #e6e6e6; border-bottom: 1px solid #e6e6e6; padding: 20px 0; }
        .discount-row input { flex-grow: 1; }
        .discount-row button { background: #e6e6e6; color: #555; border: none; padding: 0 18px; border-radius: 5px; font-weight: 600; font-size: 13px; cursor: pointer; }

        .summary-line { display: flex; justify-content: space-between; font-size: 14px; color: #555; margin-bottom: 10px; }
        .total-line { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; color: #111; margin-top: 15px; border-top: 1px solid #e6e6e6; padding-top: 15px; }
        .total-line span.currency { font-size: 12px; font-weight: normal; color: #777; margin-right: 5px; }

        @media(max-width: 900px) {
            .checkout-layout { flex-direction: column-reverse; }
            .main-section, .sidebar-section { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="checkout-layout">
        <!-- Left Column: Form -->
        <div class="main-section">
            <a href="index.html" class="brand-header">RANG DATA</a>

            <form id="checkoutForm" onsubmit="processOrder(event)">
                <div class="section-title">
                    <span>Contact</span>
                    <a href="#">Log in</a>
                </div>
                <div class="form-group">
                    <input type="text" id="email_phone" placeholder="Email or mobile phone number" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="news" checked>
                    <label for="news">Email me with news and offers</label>
                </div>

                <div class="section-title" style="margin-top: 25px;">
                    <span>Delivery</span>
                </div>
                <div class="form-group">
                    <select id="country">
                        <option value="Pakistan">Pakistan</option>
                        <option value="United Arab Emirates">United Arab Emirates</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="United States">United States</option>
                        <option value="Canada">Canada</option>
                        <option value="Saudi Arabia">Saudi Arabia</option>
                        <option value="India">India</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="fname" placeholder="First name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="lname" placeholder="Last name (optional)">
                    </div>
                </div>
                <div class="form-group">
                    <input type="text" id="address" placeholder="Address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="city" placeholder="City" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="postal" placeholder="Postal code (optional)">
                    </div>
                </div>
                <div class="form-group">
                    <input type="tel" id="phone" placeholder="Phone" required>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="save_info">
                    <label for="save_info">Save this information for next time</label>
                </div>

                <div class="section-title" style="margin-top: 25px;">
                    <span>Shipping method</span>
                </div>
                <div class="shipping-box">
                    <span>Standard Shipping</span>
                    <span>Rs 150.00</span>
                </div>

                <div class="section-title" style="margin-top: 25px;">
                    <span>Payment</span>
                </div>
                <p style="font-size: 12px; color: #777; margin-bottom: 8px;">All transactions are secure and encrypted.</p>
                
                <div class="payment-box">
                    <div class="payment-option">
                        <label for="payment_method_select" style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: #333;">Select Payment Method</label>
                        <select id="payment_method_select" required>
                            <option value="" disabled selected>-- Choose Payment Option --</option>
                            <option value="Payoneer (International Card / USD)">Payoneer (International Card / USD)</option>
                            <option value="JazzCash (Local PKR Transfer)">JazzCash (Local PKR Transfer)</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                    <div class="payment-details">
                        <i class="fa-solid fa-lock" style="color: #4A0424; margin-right: 5px;"></i> Once your order is complete, we will send the payment details to you via WhatsApp.
                    </div>
                </div>

                <button type="submit" class="btn-complete-order">Complete Order</button>
            </form>
        </div>

        <!-- Right Column: Order Summary -->
        <div class="sidebar-section">
            <div id="checkout-product-list">
                <!-- Products dynamically inserted here -->
            </div>

            <div class="discount-row">
                <input type="text" placeholder="Discount code">
                <button type="button">Apply</button>
            </div>

            <div class="summary-line">
                <span>Subtotal</span>
                <span id="subtotal-val">Rs 0.00</span>
            </div>
            <div class="summary-line">
                <span>Shipping</span>
                <span>Rs 150.00</span>
            </div>

            <div class="total-line">
                <span>Total</span>
                <div>
                    <span class="currency">PKR</span>
                    <span id="total-val" style="font-size: 22px;">Rs 150.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const checkoutItem = JSON.parse(localStorage.getItem('rd_checkout_item')) || JSON.parse(localStorage.getItem('rd_cart'))[0];
        let calculatedTotal = 0;

        if(checkoutItem) {
            const listContainer = document.getElementById('checkout-product-list');
            const subtotal = checkoutItem.priceVal * checkoutItem.qty;
            calculatedTotal = subtotal + 150;

            listContainer.innerHTML = `
                <div class="product-item">
                    <div class="product-img-wrap">
                        <img src="${checkoutItem.img}" alt="${checkoutItem.title}">
                        <span class="product-qty-badge">${checkoutItem.qty}</span>
                    </div>
                    <div class="product-info">
                        <h4>${checkoutItem.title}</h4>
                        <p>Unstitched 3-Pcs</p>
                    </div>
                    <div class="product-price">Rs ${subtotal.toLocaleString()}.00</div>
                </div>
            `;

            document.getElementById('subtotal-val').innerText = `Rs ${subtotal.toLocaleString()}.00`;
            document.getElementById('total-val').innerText = `Rs ${calculatedTotal.toLocaleString()}.00`;
        } else {
            window.location.href = "index.html";
        }

        function processOrder(e) {
            e.preventDefault();
            
            const fname = document.getElementById('fname').value;
            const lname = document.getElementById('lname').value;
            const fullName = (fname + " " + lname).trim();
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const city = document.getElementById('city').value;
            const country = document.getElementById('country').value;
            const paymentMethod = document.getElementById('payment_method_select').value;

            let waMessage = `*NEW ORDER - RANG DATA*%0A%0A` +
                            `*Customer Name:* ${fullName}%0A` +
                            `*Phone:* ${phone}%0A` +
                            `*Address:* ${address}, ${city}, ${country}%0A` +
                            `*Payment Method:* ${paymentMethod}%0A%0A` +
                            `*Item:* ${checkoutItem.title} (Qty: ${checkoutItem.qty})%0A` +
                            `*Total Amount:* Rs ${calculatedTotal.toLocaleString()}.00 (Shipping Included)`;

            let myNumber = "923406751076";
            let waURL = `https://wa.me/${myNumber}?text=${waMessage}`;

            alert(`Thank you ${fullName}!\n\nYour order details have been prepared. Click OK to send your order on WhatsApp.`);

            localStorage.removeItem('rd_checkout_item');
            window.location.href = waURL;
        }
    </script>
</body>
</html>
