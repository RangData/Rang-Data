<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Unstitched Collection | RANG DATA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Times New Roman', Times, serif; background-color: #ffffff; color: #111111; line-height: 1.6; }
        
        /* --- HEADER STYLES --- */
        .announcement-bar { background-color: #c2ae6d; color: #4a002a; display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; font-size: 14px; letter-spacing: 1px; font-weight: bold; text-transform: uppercase; }
        .top-socials a { color: #4a002a; margin-right: 15px; text-decoration: none; font-size: 15px; }
        .announcement-text { text-align: center; flex-grow: 1; font-size: 13px; }
        .top-currency select { background: transparent; color: #4a002a; border: none; font-family: 'Times New Roman', serif; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; outline: none; }

        .navbar { background-color: #4A0424; padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        
        .brand-text-logo { text-decoration: none; text-align: center; }
        .brand-text-logo span.brand-name { font-size: 28px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; color: #ffffff; display: block; line-height: 1; }

        .nav-right-container { display: flex; align-items: center; gap: 25px; }
        .nav-links { display: flex; list-style: none; gap: 22px; margin: 0; padding: 0; align-items: center; }
        .nav-links a { text-decoration: none; color: #ffffff; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #c2ae6d; }
        .nav-icons { display: flex; gap: 18px; align-items: center; }
        .nav-icons a { color: #ffffff; font-size: 18px; text-decoration: none; position: relative; }
        .cart-count { position: absolute; top: -8px; right: -8px; background-color: #c2ae6d; color: #4a002a; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 50%; }

        /* --- COLLECTION PAGE LAYOUT --- */
        .page-header { text-align: center; margin: 40px 0 30px 0; }
        .page-header h1 { font-size: 32px; text-transform: uppercase; letter-spacing: 3px; color: #4A0424; margin-bottom: 8px; font-weight: 600; }
        .page-header p { font-size: 14px; color: #666; letter-spacing: 1px; }

        /* Product Grid System */
        .collection-container { max-width: 1200px; margin: 0 auto 80px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        
        /* Individual Product Card */
        .product-card { background: #ffffff; border: 1px solid #eeeeee; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: #111111; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); border-color: #bc9c65; }
        
        .card-img-container { width: 100%; height: 360px; overflow: hidden; background: #fafafa; position: relative; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 0.5s; }
        .product-card:hover .card-img-container img { transform: scale(1.05); }
        
        .tag-badge { position: absolute; top: 12px; left: 12px; background: #4A0424; color: #ffffff; padding: 4px 10px; font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .card-info { padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .card-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: #222; min-height: 38px; display: flex; align-items: center; justify-content: center; line-height: 1.4; }
        .card-price { font-size: 15px; font-weight: bold; color: #bc9c65; }
        
        .view-btn { margin-top: auto; background: none; border: 1px solid #4A0424; color: #4A0424; padding: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; transition: 0.3s; }
        .product-card:hover .view-btn { background: #4A0424; color: #ffffff; }

        /* Footer & WhatsApp */
        .footer { background-color: #4A0424; color: #ffffff; padding: 45px 5%; text-align: center; margin-top: 60px; }
        .footer h3 { font-size: 24px; letter-spacing: 4px; margin-bottom: 10px; color: #ffffff; }
        .footer p { color: #d0c0c0; font-size: 13px; }

        .whatsapp-btn { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: #ffffff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; transition: transform 0.3s; }
        .whatsapp-btn:hover { transform: scale(1.1); color: #ffffff; }

        /* Responsive */
        @media (max-width: 992px) {
            .collection-container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 15px; text-align: center; }
            .nav-right-container { flex-direction: column; gap: 15px; }
            .collection-container { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .card-img-container { height: 280px; }
        }
    </style>
</head>
